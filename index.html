<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Список задач</title>
  <meta name="description" content="Список задач с хранением в браузере, темами и защитой от дубликатов">
  <link rel="stylesheet" href="/src/style.css">
  <noscript><style>.app { opacity: 1 !important; }</style></noscript>
  <script>
    // Тема ставится до отрисовки, чтобы страница не мигала
    (function () {
      var saved = localStorage.getItem('todo-theme');
      var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>
  <main class="app">
    <button class="theme-btn" id="theme-toggle" type="button" aria-label="Сменить тему">
      <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>

    <section class="hero">
      <div class="ring" role="img" aria-label="Прогресс выполнения">
        <svg viewBox="0 0 84 84" width="104" height="104">
          <defs>
            <linearGradient id="ring-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="var(--accent)"/>
              <stop offset="1" stop-color="var(--accent-2)"/>
            </linearGradient>
          </defs>
          <circle class="ring-bg" cx="42" cy="42" r="36"/>
          <circle class="ring-fg" id="ring" cx="42" cy="42" r="36"/>
        </svg>
        <span class="ring-value" id="percent">0%</span>
      </div>
      <div>
        <h1>Мои задачи</h1>
        <p class="subtitle" id="summary"></p>
      </div>
    </section>

    <section class="card">
      <form class="add" id="add-form" autocomplete="off" novalidate>
        <input id="task-input" type="text" maxlength="120" placeholder="Что нужно сделать?" aria-label="Новая задача" aria-describedby="form-error">
        <button type="submit" class="btn-primary">Добавить</button>
      </form>
      <p class="form-error" id="form-error" role="alert"></p>

      <div class="filters" id="filters">
        <button type="button" class="chip is-active" data-filter="all">Все</button>
        <button type="button" class="chip" data-filter="active">Активные</button>
        <button type="button" class="chip" data-filter="done">Выполненные</button>
      </div>

      <ul class="list" id="task-list"></ul>
      <p class="empty" id="empty" hidden></p>

      <footer class="bottom">
        <small>Задачи хранятся в браузере и удаляются через 7 дней без изменений.</small>
        <button type="button" class="link-btn" id="clear-done">Убрать выполненные</button>
      </footer>
    </section>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
